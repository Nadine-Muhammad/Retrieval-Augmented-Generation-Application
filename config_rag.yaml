cohere:
  api_key:
  name: "rerank-english-v3.0"
  temp: 0

chunking:
  chunk_size: 1024
  overlap: 150

embeddings:
  name: "sentence-transformers/all-MiniLM-l6-v2"
  kwargs:
    device: "cuda:0"
  encode_kwargs: 
    normalize_embeddings: True

phi:
  api_key:
  project: "RAG_Phi-3.5-mini"
  name: "microsoft/Phi-3.5-mini-instruct"
  temp: 0.0
  max_new_tokens: 150
  repetition_penalty: 1
  pad_token_id: 32000
  device_map: "cuda:0"
  torch_dtype: "auto"
  attn_impl: "eager"
  trust_remote_code: True
  tokenizer:
    name: "microsoft/Phi-3.5-mini-instruct"
    padding: True
    truncation: False
    skip_special_tokens: True
    return_tensors: "pt"
  prompt: |
          Using the following context: {context}.
          Provide the answer to the following question without any further explanation or follow-up. Question: {question}
           

falcon:
  api_key:
  project: "FALCON_7B_RAG"
  name: "tiiuae/falcon-7b-instruct"
  temp: 0.0
  max_new_tokens: 100
  repetition_penalty: 1.2
  pad_token_id: 11
  device_map: "cuda:0"
  tokenizer:
    name:  "tiiuae/falcon-7b-instruct"
    padding: True
    truncation: False
    skip_special_tokens: True
    return_tensors: "pt"
  prompt: |
          Using the following context: {context}.
          Provide the answer to the following question without any further explanation or follow-up. Question: {question}

llama:
  api_key:
  project: "Llama3RAG"
  name: "/content/drive/MyDrive/llama-3-8b"
  temp: 0.0
  max_new_tokens: 50
  repetition_penalty: 1.1
  pad_token_id: 128001
  device_map: "cuda:0"
  tokenizer:
    name: "/content/drive/MyDrive/llama-3-8b-tokenizer"
    padding: True
    truncation: False  
    skip_special_tokens: True
    return_tensors: "pt"   
  prompt: |
          Using the following context: {context}.
          Provide only the answer to the following question without any further explanation or follow-up. Question: {question}   

retriever:
  search_type: "similarity"
  top_match: 20

quantization:
  load_in_4bit: True
  bnb_4bit_quant_type: "nf4"
  low_cpu_mem_usage: True

allow_dangerous_deserialization: True  

gradio:
  share: True
  debug: True
